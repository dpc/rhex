[package]
name = "rhex"
version = "0.1.1"
edition = "2024"
authors = ["Dawid Ciężarkiewicz <dpc@dpc.pw>"]
description = "ASCII terminal hexagonal map roguelike written in Rust"
keywords = ["game", "hex", "hexagonal", "roguelike"]
license = "MPL-2.0"
documentation = "https://dpc.github.io/rhex/"
homepage = "https://github.com/dpc/rhex"
repository = "https://github.com/dpc/rhex"
readme = "README.md"

[profile.dev]
codegen-units = 2
debug = false
debug-assertions = true
lto = false
opt-level = 1

[profile.dev.package."*"]
debug = false

[profile.ci]
debug = false
incremental = false
inherits = "dev"
lto = "off"

[profile.ci.package."*"]
debug = false

[dependencies]
chrono = "0.4.42"
dpc-simplemap = "0.1.0"
fern = "0.7.1"
fnv = "1.0.7"
hex2d = "1.1.0"
hex2d-dpcext = { git = "https://github.com/dpc/hex2d-dpcext-rs" }
log = "0.4.28"
ncurses = { version = "6.0.1", features = ["wide"] }
num = "0.4.3"
rand = "0.10.3"
